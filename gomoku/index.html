<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171411">
  <title>五子棋 · Gomoku</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">JUST US · 五子棋</p>
        <h1>这一局，想和你下。</h1>
      </div>
      <button id="restart" class="restart" type="button">重新开始</button>
    </header>

    <section id="lobby" class="lobby">
      <div>
        <p class="eyebrow">发出邀请</p>
        <h2>找个人，下一局</h2>
        <p>输赢不重要，重要的是你愿意点开这个链接。</p>
      </div>
      <div class="lobby-actions">
        <button id="create-room" class="primary" type="button">创建联机房间</button>
        <form id="join-form">
          <input id="room-code-input" maxlength="6" autocomplete="off" placeholder="输入六位房间码" aria-label="房间码">
          <button type="submit">加入房间</button>
        </form>
        <button id="local-game" type="button">本地双人</button>
      </div>
      <p id="lobby-message" class="message" aria-live="polite"></p>
    </section>

    <section id="game-card" class="game-card" hidden>
      <div class="room-row">
        <p id="mode-label" class="room-label">本地双人</p>
        <button id="copy-link" type="button" hidden>复制邀请链接</button>
        <button id="leave-room" type="button">返回大厅</button>
      </div>
      <div class="status-row">
        <div id="status" class="status" aria-live="polite"></div>
        <p id="move-count"></p>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="720" height="720" aria-label="五子棋棋盘"></canvas>
      </div>
      <div class="actions">
        <button id="undo" type="button">悔棋</button>
        <p id="game-hint">先连成五子者胜 · 输的人下一局执黑</p>
      </div>
      <div id="undo-request" class="undo-request" hidden>
        <p id="undo-request-text"></p>
        <div>
          <button id="accept-undo" class="primary" type="button">好吧，让你一步</button>
          <button id="reject-undo" type="button">不许耍赖</button>
        </div>
      </div>
    </section>
  </main>

  <div id="winner-modal" class="modal" hidden>
    <div class="modal-card">
      <span id="winner-stone" class="stone black large"></span>
      <p class="eyebrow">本局结束</p>
      <h2 id="winner-text"></h2>
      <button id="play-again" type="button">再来一局</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./game.js"></script>
</body>
</html>
