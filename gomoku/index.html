<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171411">
  <title>五子棋 · Gomoku</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">GOMOKU · 五子棋</p>
        <h1>落子，连成一线。</h1>
      </div>
      <button id="restart" class="restart" type="button">重新开始</button>
    </header>

    <section class="game-card">
      <div class="status-row">
        <div id="status" class="status" aria-live="polite">
          <span class="stone black"></span>
          <span>黑方回合</span>
        </div>
        <p id="move-count">第 1 手</p>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="720" height="720" aria-label="五子棋棋盘"></canvas>
      </div>

      <div class="actions">
        <button id="undo" type="button">悔棋</button>
        <p>双人同屏 · 先连成五子者胜</p>
      </div>
    </section>
  </main>

  <div id="winner-modal" class="modal" hidden>
    <div class="modal-card">
      <span id="winner-stone" class="stone black large"></span>
      <p class="eyebrow">本局结束</p>
      <h2 id="winner-text">黑方获胜</h2>
      <button id="play-again" type="button">再来一局</button>
    </div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
